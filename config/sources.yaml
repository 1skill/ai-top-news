# Configuration for the AI Top News site.
# Edit this file to add/remove news sources or tune the GitHub AI radar.

site:
  title: "AI 头条"
  subtitle: "每日 AI 新闻 · GitHub AI 项目雷达"
  # Timezone label shown in the footer (display only).
  timezone: "UTC"
  # Max headlines shown on the page.
  max_news: 36
  # Max repositories shown in the radar.
  max_repos: 30

# Translate English headlines / descriptions into Chinese at build time.
# Falls back to the original text if a translation call fails, so the
# site is never broken by a translation hiccup.
translate:
  enabled: true
  target: "zh-CN"
  # Show the original English text as a small line under the Chinese.
  show_original: true

# RSS / Atom feeds for the "AI 每日新闻" section.
# `limit` caps how many items we pull from each single feed before merging.
news_feeds:
  - name: "MIT Tech Review · AI"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
    limit: 8
  - name: "VentureBeat · AI"
    url: "https://venturebeat.com/category/ai/feed/"
    limit: 8
  - name: "The Verge · AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    limit: 8
  - name: "TechCrunch · AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    limit: 8
  - name: "Ars Technica · AI"
    url: "https://arstechnica.com/ai/feed/"
    limit: 6
  - name: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"
    limit: 6
  - name: "Google DeepMind Blog"
    url: "https://deepmind.google/blog/rss.xml"
    limit: 6
  - name: "Google AI Blog"
    url: "https://blog.google/technology/ai/rss/"
    limit: 6

# arXiv 论文雷达（研究前沿）。每个分类的最新提交合并去重后展示。
arxiv:
  enabled: true
  categories:
    - "cs.AI"   # 人工智能
    - "cs.CL"   # 计算语言学 / NLP
    - "cs.LG"   # 机器学习
    - "cs.CV"   # 计算机视觉
  max_items: 24

# Hugging Face 热门模型（大家正在用什么）。按趋势分数排序。
huggingface:
  enabled: true
  max_items: 24

# Hacker News AI 热议（社区 / 产品风向）。多关键词搜索后按热度合并。
hacker_news:
  enabled: true
  queries:
    - "AI"
    - "LLM"
    - "GPT"
    - "machine learning"
    - "agent"
  min_points: 50   # 过滤掉热度过低的帖子
  max_items: 20

# iOS App Store "新品雷达" — apps newly entering the charts.
# Newness is computed by diffing against data/state.json, so an app is only
# shown the first time it appears; repeats are suppressed automatically.
app_store:
  enabled: true
  # Storefront country codes to scan (us / cn…). The cn store returns 中文名.
  countries: ["us", "cn"]
  # Chart feeds to scan; every app across all feeds/countries is de-duplicated.
  feeds: ["top-free", "top-paid", "top-grossing"]
  # How many entries to pull per feed.
  limit: 50
  # Show apps first seen within this many days (1 = only today's new arrivals).
  show_days: 1
  # Max apps shown on the page.
  max_show: 24
  # Enrich shown apps (rating / price / desc / hi-res icon) via iTunes lookup.
  enrich: true
  # Forget apps not seen for this many days (bounds state size).
  retention_days: 120

# Authoritative app-recommendation sites for the "App 推荐精选" section (RSS).
# Items already shown on a previous day are suppressed via data/state.json.
app_recs:
  enabled: true
  feeds:
    - name: "少数派 sspai"
      url: "https://sspai.com/feed"
      limit: 10
    - name: "Product Hunt"
      url: "https://www.producthunt.com/feed"
      limit: 10
    - name: "MacStories"
      url: "https://www.macstories.net/feed/"
      limit: 6
    - name: "AppAdvice"
      url: "https://appadvice.com/feed"
      limit: 6
  max_show: 20
  retention_days: 60

# GitHub "涨星榜" settings — ranks AI repos by NEW stars gained over time.
# Growth is measured against snapshots remembered in data/state.json, so real
# numbers appear from the second build on (the first run seeds the baseline).
github:
  # Only consider repos pushed within this many days (keeps the board active).
  active_days: 120
  # Window (days) over which "new stars" are measured before the baseline resets.
  growth_window_days: 1
  # Forget snapshots for repos not seen for this many days (bounds state size).
  retention_days: 30
  # Repos created within this many days get a "🆕 NEW" badge.
  new_within_days: 10
  # Topics to search. Results across all topics are merged & de-duplicated.
  topics:
    - "llm"
    - "large-language-models"
    - "generative-ai"
    - "agent"
    - "ai-agents"
    - "rag"
    - "machine-learning"
    - "deep-learning"
    - "artificial-intelligence"
    - "diffusion-models"
    - "computer-vision"
    - "mcp"
  # Ignore tiny repos (stars below this are dropped).
  min_stars: 40
