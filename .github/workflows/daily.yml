name: Build & Deploy AI Top News

on:
  # Twice a day, in US Pacific time:
  #   14:00 UTC = 07:00 PDT (morning)   |   02:00 UTC = 19:00 PDT (after dinner)
  # Cron is fixed to UTC, so during PST (winter) these land at 06:00 / 18:00 local.
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 2 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:
  # Rebuild whenever the site code changes.
  push:
    branches: [main]

# Permissions: publish to Pages (pages/id-token) + commit the star-growth
# snapshots back to the repo (contents: write).
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer runs win.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python scripts/build.py
        env:
          # Grants a higher GitHub Search rate limit during the build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Enables persisting data/state.json (star-growth snapshots).
          PERSIST_STATE: "1"

      - name: Commit star-growth snapshots
        # Only on main; "[skip ci]" keeps this commit from re-triggering the run.
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain data/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update star-growth snapshots [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No snapshot change to commit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
